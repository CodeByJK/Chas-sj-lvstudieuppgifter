<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
     <!-- A div with container id to hold the card -->
    <div id="container">

        <!-- A div with card class for the card  -->
        <div class="card">

            <img src="tadeusz-zachwieja-QrdBR0aOkV4-unsplash.jpg" alt="Elafonisi Beach">

            <!-- A div with card__details class to hold the details in the card  -->
            <div class="card__details">
            
            <!-- Span with tag class for the tag -->
            <span class="tag">Beach</span>

            <span class="tag">Ocean</span>

            <!-- A div with name class for the name of the card -->
            <div class="name">Elafonisi beach</div>

            <p> Elafonisi beach is a world-famous paradise located on the southwestern coast of Crete, Greece. It is best known for its striking pink sand, which gets its unique color from millions of crushed sea shells mixed into the shoreline.</p>

            <button>Read more</button>
        </div>
    </div>
</body>
</html>
